name: 功能请求
description: 提出新的能力或行为改动
title: "[feat] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请先读 [PLUG.md](../PLUG.md) 的 §8「必须保持的不变量」——与它们冲突的想法通常不会被接受。

  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 描述场景与痛点，而不是直接给方案
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议的做法
      description: 若涉及配置项，请说明默认值如何取（本项目倾向默认安全、默认零依赖）
    validations:
      required: false

  - type: checkboxes
    id: constraints
    attributes:
      label: 约束确认
      options:
        - label: 方案不需要新增第三方依赖
          required: false
        - label: 方案不要求注册 `ctx.web` 提供者（会与既有提供者冲突）
          required: false
        - label: 涉及开关语义时，默认值仍为 fail-closed（不开启就不联网）
          required: false
